name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: pip install pytest pyflakes pyyaml websockets
      - run: python -m pyflakes bob setup-windows tests
      - run: python -m pytest -q tests
  windows-app:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r setup-windows/requirements.txt pyinstaller==6.11.1
      - name: build installs this release's install.sh
        shell: pwsh
        run: Set-Content -Path setup-windows/_version.py -Value "TAG = '$env:GITHUB_REF_NAME'"
      - run: pyinstaller --onefile --windowed --uac-admin --name Kevin-Setup --paths setup-windows setup-windows/bob_setup.py
      - name: self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\Kevin-Setup.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content dist\selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: checksum
        shell: pwsh
        run: (Get-FileHash dist\Kevin-Setup.exe -Algorithm SHA256).Hash + "  Kevin-Setup.exe" | Out-File -Encoding ascii dist\Kevin-Setup.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kevin-Setup.exe
            dist/Kevin-Setup.exe.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
